# Home Assistant 1.3 — soltanto le azioni utilizzate dall'integrazione.
# Tutte le operazioni di scrittura della settimana richiedono prima una
# anteprima valida, poi fingerprint e autorizzazione esplicita.
# Nessuna azione qui permette di scrivere manualmente statistiche gas.

preview_weekly_change:
  name: "Cube S — Anteprima modifica fasce"
  description: >
    Legge il programma settimanale corrente dal cloud Ariston e mostra
    una modifica di un giorno, senza inviare scritture. Operazioni:
    move (sposta un orario), add (aggiungi una fascia con inizio e fine),
    remove (elimina una fascia). Restituisce un fingerprint da usare
    soltanto dopo aver verificato l'anteprima.
  fields:
    day:
      name: "Giorno (0=domenica, 1=lunedì ... 6=sabato)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    operation:
      name: Operazione
      required: true
      selector:
        select:
          options:
            - label: "Sposta orario"
              value: move
            - label: "Aggiungi fascia"
              value: add
            - label: "Elimina fascia"
              value: remove
    from_time:
      name: "Orario esistente da spostare/eliminare (HH:MM)"
      selector:
        text:
    to_time:
      name: "Nuovo orario / inizio fascia (HH:MM)"
      selector:
        text:
    end_time:
      name: "Fine fascia aggiunta (HH:MM)"
      description: >
        Obbligatoria con add, successiva all'inizio e senza sovrapporre
        cambi esistenti. Il preset precedente riprende alla fine.
      selector:
        text:
    preset:
      name: "Preset della nuova fascia (solo add)"
      selector:
        select:
          options:
            - Comfort
            - Economy

write_weekly_change:
  name: "Cube S — Salva modifica fasce"
  description: >
    Scrive una modifica approvata del programma Cube S. Prima confronta
    il fingerprint con una lettura fresca, poi esegue al massimo un
    POST e verifica tutti i sette giorni. Richiede confirm=true.
    Se la risposta cloud non è confermata, controlla nell'app Ariston
    prima di ritentare.
  fields:
    day:
      name: "Giorno (0=domenica, 1=lunedì ... 6=sabato)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    operation:
      name: Operazione
      required: true
      selector:
        select:
          options:
            - label: "Sposta orario"
              value: move
            - label: "Aggiungi fascia"
              value: add
            - label: "Elimina fascia"
              value: remove
    from_time:
      name: "Orario esistente da spostare/eliminare (HH:MM)"
      selector:
        text:
    to_time:
      name: "Nuovo orario / inizio fascia (HH:MM)"
      selector:
        text:
    end_time:
      name: "Fine fascia aggiunta (HH:MM)"
      selector:
        text:
    preset:
      name: "Preset della nuova fascia (solo add)"
      selector:
        select:
          options:
            - Comfort
            - Economy
    expected_fingerprint:
      name: "Fingerprint restituito dall'anteprima"
      required: true
      selector:
        text:
    confirm:
      name: "Autorizzo una modifica reale del programma Cube S"
      required: true
      selector:
        boolean:

preview_weekly_clone:
  name: "Cube S — Anteprima clonazione giorni"
  description: >
    Legge il programma dei sette giorni e prepara la copia di un
    giorno sorgente su uno o più giorni destinazione. Mostra i
    programmi prima/dopo senza cambiare nulla sul cloud.
  fields:
    source_day:
      name: "Giorno sorgente (0=domenica, 1=lunedì ... 6=sabato)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    destinations:
      name: "Giorni destinatari"
      description: >
        Lista di numeri: [3, 5, 0] copia il lunedì su mercoledì,
        venerdì e domenica. Sorgente e giorni ripetuti non ammessi.
      required: true
      selector:
        object:

clone_weekly_days:
  name: "Cube S — Clona giorno"
  description: >
    Copia un programma giornaliero su più destinatari con conferma
    esplicita e fingerprint fresco. Tutti i destinatari vengono
    modificati con un solo POST; il programma completo viene riletto
    e verificato. Non ritentare automaticamente dopo esito incerto.
  fields:
    source_day:
      name: "Giorno sorgente (0=domenica, 1=lunedì ... 6=sabato)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    destinations:
      name: "Giorni destinatari (esempio: [3, 5, 0])"
      required: true
      selector:
        object:
    expected_fingerprint:
      name: "Fingerprint restituito dall'anteprima"
      required: true
      selector:
        text:
    confirm:
      name: "Autorizzo una clonazione reale del programma Cube S"
      required: true
      selector:
        boolean:

inspect_energy_hour_alignment:
  name: "Gas — Verifica statistiche di un'ora (sola lettura)"
  description: >
    Ispeziona le statistiche Recorder di un'ora e delle ore adiacenti
    per i due sensori cumulativi del gas. Non modifica statistiche,
    sensori o ledger. Disponibile per le ultime 72 ore.
  fields:
    target_start:
      name: "Inizio dell'ora da controllare (timestamp UTC ISO 8601)"
      description: >
        Esempio: 2026-10-28T14:00:00+00:00 indica le 15–16
        italiane del 28 ottobre 2026.
      required: true
      selector:
        text:

inspect_automatic_energy_hour_alignment:
  name: "Gas — Ultime correzioni automatiche (sola lettura)"
  description: >
    Mostra gli ultimi otto tentativi di allineamento orario gas e
    relativi esiti (confermato, non necessario, saltato o incerto).
    L'automatismo si attiva alle :15 delle ore dispari locali.
    Nessun retry automatico o recupero delle fasce perse. Lo storico
    diagnostico si azzera al riavvio di Home Assistant; le statistiche
    Energia e il ledger non vengono modificati da questa lettura.
