preview_weekly_change:
  name: "Cube S — Anteprima modifica fasce"
  description: >
    SOLO LETTURA: fresh GET of the weekly programme, then prepare one weekday
    boundary move, finite start/end addition, or removal. Add requires
    explicit start (to_time) and end (end_time), in 15-minute steps.
    Returns original/modified weekday with fingerprint; no schedule POST.
  fields:
    day:
      name: "Day (Sunday=0, Monday=1, ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - label: Move existing boundary
              value: move
            - label: Add Comfort/Economy boundary
              value: add
            - label: Remove existing boundary
              value: remove
    from_time:
      name: "Old boundary (move/remove, HH:MM)"
      selector:
        text:
    to_time:
      name: "Start/new time (move/add, HH:MM, 15-minute increments)"
      selector:
        text:
    end_time:
      name: "Explicit end of new band (required for add, HH:MM, 15-minute increments)"
      description: >
        Mandatory when operation is add. Must be later than to_time and
        cannot cross an existing boundary. Restores the preceding preset
        at this time; no implicit midnight end. Not used for move/remove.
      selector:
        text:
    preset:
      name: "New preset (add only)"
      selector:
        select:
          options:
            - Comfort
            - Economy

write_weekly_change:
  name: "Cube S — Salva modifica fasce"
  description: >
    Modifica confermata di una fascia settimanale del Cube S. Adding
    requires explicit start and end, creates the return-to-original preset
    at end_time, and disallows overlaps. Times use 15-minute steps.
    Fresh cloud GET and fingerprint check, exactly ONE schedule POST, and
    seven-day readback. If readback fails, inspect official app before retry.
    Questa operazione modifica il programma salvato nel cloud Ariston.
  fields:
    day:
      name: "Day (Sunday=0, Monday=1, ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - move
            - add
            - remove
    from_time:
      name: "Old boundary (move/remove, HH:MM)"
      selector:
        text:
    to_time:
      name: "Start/new time (move/add, HH:MM, 15-minute increments)"
      selector:
        text:
    end_time:
      name: "Explicit end of new band (required for add, HH:MM, 15-minute increments)"
      description: >
        Mandatory when operation is add. Must be later than to_time and
        cannot cross an existing boundary. Restores the preceding preset
        at this time; no implicit midnight end. Not used for move/remove.
      selector:
        text:
    preset:
      name: "New preset (add only)"
      selector:
        select:
          options:
            - Comfort
            - Economy
    expected_fingerprint:
      name: Fingerprint from preview
      required: true
      selector:
        text:
    confirm:
      name: Confirm one real Cube S schedule POST
      required: true
      selector:
        boolean:

preview_weekly_clone:
  name: "Cube S — Anteprima clonazione giorni"
  description: >
    SOLO LETTURA. Read the current seven-day programme once, then preview
    copying one source weekday to one or more chosen destinations. The
    before/after preview includes every selected day. No cloud write.
  fields:
    source_day:
      name: "Source weekday (Sunday=0, Monday=1 ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    destinations:
      name: "Destination weekdays"
      description: >
        List of weekday numbers, for example [3, 5, 0] copies Monday
        (source_day=1) to Wednesday, Friday and Sunday. Duplicates and
        source-in-target are rejected.
      required: true
      selector:
        object:

clone_weekly_days:
  name: "Cube S — Clona giorno"
  description: >
    Explicit confirmed write. Requires matching preview fingerprint,
    one fresh GET, ONE cloud POST for all destinations, followed by an
    exact full-week GET/readback. No automatic retry on ambiguous writes.
    The source and unselected weekdays must remain unchanged.
  fields:
    source_day:
      name: "Source weekday (Sunday=0, Monday=1 ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    destinations:
      name: "Destination weekdays"
      description: "List of weekday numbers, e.g. [3, 5, 0]."
      required: true
      selector:
        object:
    expected_fingerprint:
      name: "Full-week fingerprint from preview"
      required: true
      selector:
        text:
    confirm:
      name: "Confirm one real cloud schedule write"
      required: true
      selector:
        boolean:

inspect_energy_hour_alignment:
  name: "Gas — Verifica statistiche di un'ora (lettura)"
  description: >
    SOLO LETTURA: inspect an existing hourly Recorder row and its adjacent
    hours for both current gas sensor IDs. No statistics import, no sensor
    update, no gas ledger mutation. Use to check the first manual correction
    after an ambiguous write result.
  fields:
    target_start:
      name: "Hour to inspect in UTC ISO 8601"
      description: >
        Example for Italian 07:00–08:00 on 2026-10-28:
        2026-10-28T06:00:00+00:00. Only the last 72 hours.
      required: true
      selector:
        text:

inspect_automatic_energy_hour_alignment:
  name: "Gas — Ultime correzioni automatiche (lettura)"
  description: >
    SOLO LETTURA. Mostra gli ultimi otto tentativi automatici di allineamento
    delle ore Energia, inclusi i periodi senza consumo, le correzioni
    confermate e gli errori non confermati. Non legge né modifica i sensori
    cumulativi, il ledger o le statistiche Recorder. Gli esiti sono
    conservati solo in memoria e si azzerano riavviando Home Assistant.
    Gli aggiornamenti automatici avvengono ogni due ore alle :15 delle
    ore dispari locali; non ci sono recuperi di cicli persi né retry.
