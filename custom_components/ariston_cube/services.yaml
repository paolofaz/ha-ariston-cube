preview_weekly_slice:
  name: Preview Cube S weekly time boundary
  description: >
    Experimental developer action. Reads the actual Cube S weekly schedule,
    moves one existing boundary in a local preview, and returns the before/after
    times. Does not save or change the boiler schedule.
  fields:
    day:
      required: true
      name: Day
      description: "0 Sunday, 1 Monday, 2 Tuesday, 3 Wednesday, 4 Thursday, 5 Friday, 6 Saturday"
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    from_time:
      required: true
      name: Existing start time (HH:MM)
      selector:
        text:
    to_time:
      required: true
      name: Proposed new start time (HH:MM)
      selector:
        text:

probe_weekly_methods:
  name: Probe Cube S weekly API methods
  description: >
    Sends one read-only HTTP OPTIONS request to the existing Cube S
    schedule endpoint. Returns status and advertised method names, if any.
    It does not write a schedule; a POST/PUT in the response is not
    proof that its JSON format is known.

test_write_weekly_slice:
  name: "EXPERIMENTAL — write one Cube S weekly boundary"
  description: >
    UNSUPPORTED FIELD TEST. Makes exactly one POST to the Cube S weekly
    schedule endpoint using a candidate JSON format; then checks the
    complete seven-day timetable. It may be rejected or accepted with
    different semantics. Requires fingerprint from the preview and explicit
    confirmation. Reinstalling stable DOES NOT restore saved boiler schedules.
  fields:
    day:
      name: "Day (0=Sunday, 1=Monday ... 6=Saturday)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    from_time:
      name: "Existing start time (HH:MM)"
      required: true
      selector:
        text:
    to_time:
      name: "New start time (HH:MM)"
      required: true
      selector:
        text:
    expected_fingerprint:
      name: "Source fingerprint from preview"
      required: true
      description: "Must match the freshest cloud programme before writing"
      selector:
        text:
    confirm:
      name: "I authorize this unsupported schedule-write experiment"
      required: true
      selector:
        boolean:


preview_weekly_change:
  name: "Cube S — preview move/add/remove time band"
  description: >
    READ ONLY: fresh GET of the weekly programme, then prepare one weekday
    boundary move, addition, or removal. Returns original/modified weekday
    with fingerprint; never sends a schedule POST.
  fields:
    day:
      name: "Day (Sunday=0, Monday=1, ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - label: Move existing boundary
              value: move
            - label: Add Comfort/Economy boundary
              value: add
            - label: Remove existing boundary
              value: remove
    from_time:
      name: "Old boundary (move/remove, HH:MM)"
      selector:
        text:
    to_time:
      name: "New boundary (move/add, HH:MM)"
      selector:
        text:
    preset:
      name: "New preset (add only)"
      selector:
        select:
          options:
            - Comfort
            - Economy

write_weekly_change:
  name: "Cube S — write one weekly band change (experimental)"
  description: >
    An explicitly confirmed move/add/remove of ONE boundary on ONE weekday.
    Fresh cloud GET and fingerprint check, exactly ONE schedule POST, and
    seven-day readback. If readback fails, inspect official app before retry.
    This operation changes the real boiler and cannot be undone by reinstalling.
  fields:
    day:
      name: "Day (Sunday=0, Monday=1, ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - move
            - add
            - remove
    from_time:
      name: "Old boundary (move/remove, HH:MM)"
      selector:
        text:
    to_time:
      name: "New boundary (move/add, HH:MM)"
      selector:
        text:
    preset:
      name: "New preset (add only)"
      selector:
        select:
          options:
            - Comfort
            - Economy
    expected_fingerprint:
      name: Fingerprint from preview
      required: true
      selector:
        text:
    confirm:
      name: Confirm one real Cube S schedule POST
      required: true
      selector:
        boolean:
