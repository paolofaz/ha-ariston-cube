preview_weekly_slice:
  name: Preview Cube S weekly time boundary
  description: >
    Experimental developer action. Reads the actual Cube S weekly schedule,
    moves one existing boundary in a local preview, and returns the before/after
    times. Does not save or change the boiler schedule.
  fields:
    day:
      required: true
      name: Day
      description: "0 Sunday, 1 Monday, 2 Tuesday, 3 Wednesday, 4 Thursday, 5 Friday, 6 Saturday"
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    from_time:
      required: true
      name: Existing start time (HH:MM)
      selector:
        text:
    to_time:
      required: true
      name: Proposed new start time (HH:MM)
      selector:
        text:

probe_weekly_methods:
  name: Probe Cube S weekly API methods
  description: >
    Sends one read-only HTTP OPTIONS request to the existing Cube S
    schedule endpoint. Returns status and advertised method names, if any.
    It does not write a schedule; a POST/PUT in the response is not
    proof that its JSON format is known.

test_write_weekly_slice:
  name: "EXPERIMENTAL — write one Cube S weekly boundary"
  description: >
    UNSUPPORTED FIELD TEST. Makes exactly one POST to the Cube S weekly
    schedule endpoint using a candidate JSON format; then checks the
    complete seven-day timetable. It may be rejected or accepted with
    different semantics. Requires fingerprint from the preview and explicit
    confirmation. Reinstalling stable DOES NOT restore saved boiler schedules.
  fields:
    day:
      name: "Day (0=Sunday, 1=Monday ... 6=Saturday)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    from_time:
      name: "Existing start time (HH:MM)"
      required: true
      selector:
        text:
    to_time:
      name: "New start time (HH:MM)"
      required: true
      selector:
        text:
    expected_fingerprint:
      name: "Source fingerprint from preview"
      required: true
      description: "Must match the freshest cloud programme before writing"
      selector:
        text:
    confirm:
      name: "I authorize this unsupported schedule-write experiment"
      required: true
      selector:
        boolean:


preview_weekly_change:
  name: "Cube S — preview move/add/remove time band"
  description: >
    READ ONLY: fresh GET of the weekly programme, then prepare one weekday
    boundary move, finite start/end addition, or removal. Add requires
    explicit start (to_time) and end (end_time), in 15-minute steps.
    Returns original/modified weekday with fingerprint; no schedule POST.
  fields:
    day:
      name: "Day (Sunday=0, Monday=1, ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - label: Move existing boundary
              value: move
            - label: Add Comfort/Economy boundary
              value: add
            - label: Remove existing boundary
              value: remove
    from_time:
      name: "Old boundary (move/remove, HH:MM)"
      selector:
        text:
    to_time:
      name: "Start/new time (move/add, HH:MM, 15-minute increments)"
      selector:
        text:
    end_time:
      name: "Explicit end of new band (required for add, HH:MM, 15-minute increments)"
      description: >
        Mandatory when operation is add. Must be later than to_time and
        cannot cross an existing boundary. Restores the preceding preset
        at this time; no implicit midnight end. Not used for move/remove.
      selector:
        text:
    preset:
      name: "New preset (add only)"
      selector:
        select:
          options:
            - Comfort
            - Economy

write_weekly_change:
  name: "Cube S — write one weekly band change (experimental)"
  description: >
    An explicitly confirmed move/add/remove of one weekday band. Adding
    requires explicit start and end, creates the return-to-original preset
    at end_time, and disallows overlaps. Times use 15-minute steps.
    Fresh cloud GET and fingerprint check, exactly ONE schedule POST, and
    seven-day readback. If readback fails, inspect official app before retry.
    This operation changes the real boiler and cannot be undone by reinstalling.
  fields:
    day:
      name: "Day (Sunday=0, Monday=1, ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
            - move
            - add
            - remove
    from_time:
      name: "Old boundary (move/remove, HH:MM)"
      selector:
        text:
    to_time:
      name: "Start/new time (move/add, HH:MM, 15-minute increments)"
      selector:
        text:
    end_time:
      name: "Explicit end of new band (required for add, HH:MM, 15-minute increments)"
      description: >
        Mandatory when operation is add. Must be later than to_time and
        cannot cross an existing boundary. Restores the preceding preset
        at this time; no implicit midnight end. Not used for move/remove.
      selector:
        text:
    preset:
      name: "New preset (add only)"
      selector:
        select:
          options:
            - Comfort
            - Economy
    expected_fingerprint:
      name: Fingerprint from preview
      required: true
      selector:
        text:
    confirm:
      name: Confirm one real Cube S schedule POST
      required: true
      selector:
        boolean:

preview_weekly_clone:
  name: "Cube S — preview clone from one day to several days"
  description: >
    READ ONLY. Read the current seven-day programme once, then preview
    copying one source weekday to one or more chosen destinations. The
    before/after preview includes every selected day. No cloud write.
  fields:
    source_day:
      name: "Source weekday (Sunday=0, Monday=1 ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    destinations:
      name: "Destination weekdays"
      description: >
        List of weekday numbers, for example [3, 5, 0] copies Monday
        (source_day=1) to Wednesday, Friday and Sunday. Duplicates and
        source-in-target are rejected.
      required: true
      selector:
        object:

clone_weekly_days:
  name: "Cube S — clone one weekday to multiple selected weekdays"
  description: >
    Explicit confirmed write. Requires matching preview fingerprint,
    one fresh GET, ONE cloud POST for all destinations, followed by an
    exact full-week GET/readback. No automatic retry on ambiguous writes.
    The source and unselected weekdays must remain unchanged.
  fields:
    source_day:
      name: "Source weekday (Sunday=0, Monday=1 ... Saturday=6)"
      required: true
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    destinations:
      name: "Destination weekdays"
      description: "List of weekday numbers, e.g. [3, 5, 0]."
      required: true
      selector:
        object:
    expected_fingerprint:
      name: "Full-week fingerprint from preview"
      required: true
      selector:
        text:
    confirm:
      name: "Confirm one real cloud schedule write"
      required: true
      selector:
        boolean:
