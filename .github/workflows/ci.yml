name: Python tests

on:
  push:
    branches:
      - main
      - feat/**
      - chore/**
      - release/**
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install pytest aiohttp
      - name: Compile Python
        run: python -m compileall -q custom_components/ariston_cube tests
      - name: Unit tests (offline)
        run: python -m pytest -q
      - name: Check weekly Lovelace editor JavaScript syntax
        run: |
          node --check custom_components/ariston_cube/www/ariston-cube-weekly-card.js
          node --check frontend/ariston-cube-weekly-card.js
      - name: Test Lovelace editor interactions (Node)
        run: node --test tests/test_weekly_editor.mjs

  stable-release:
    name: Publish stable v1.2.0
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable v1.2.0 after successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(
              Path("custom_components/ariston_cube/manifest.json").read_text()
          )["version"]
          assert version == "1.2.0", "Refusing mismatched stable release"
          PY
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.2.0 already exists; preserving immutable tag"
            exit 0
          fi
          gh release create v1.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Ariston Cube 1.2.0 — Cube S + gas Energia automatico" \
            --notes-file docs/releases/v1.2.0.md

  responsive-services-rc:
    name: Publish experimental 1.3.0-rc.1
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/v1.3-lovelace-responsive-services-cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish immutable v1.3.0-rc.1 after CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(
              Path("custom_components/ariston_cube/manifest.json").read_text()
          )
          assert manifest["version"] == "1.3.0-rc.1", "Incorrect pre-release version"
          PY
          if gh release view v1.3.0-rc.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The immutable 1.3.0-rc.1 release already exists; keeping it"
            exit 0
          fi
          gh release create v1.3.0-rc.1 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Ariston Cube 1.3.0-rc.1 — Lovelace reattiva e azioni essenziali" --notes-file docs/releases/v1.3.0-rc.1.md
